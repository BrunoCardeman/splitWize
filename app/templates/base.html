<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitFácil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
    header {
      background: #2d6a4f; color: white; padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.5rem; }
    nav a {
      color: white; text-decoration: none; margin-left: 1.5rem;
      font-weight: 500; opacity: 0.85;
    }
    nav a:hover { opacity: 1; text-decoration: underline; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card {
      background: white; border-radius: 12px; padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 1.5rem;
    }
    h2 { color: #2d6a4f; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f7fafc; font-weight: 600; color: #4a5568; }
    .btn {
      display: inline-block; padding: .5rem 1.2rem; border-radius: 8px;
      text-decoration: none; font-weight: 600; cursor: pointer; border: none;
      font-size: .95rem;
    }
    .btn-primary { background: #2d6a4f; color: white; }
    .btn-primary:hover { background: #1b4332; }
    .btn-secondary { background: #e2e8f0; color: #2d3748; }
    .btn-secondary:hover { background: #cbd5e0; }
    .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2;
             padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
    form label { display: block; margin-bottom: .25rem; font-weight: 500; color: #4a5568; }
    form input, form select { width: 100%; padding: .5rem .75rem; border: 1px solid #cbd5e0;
      border-radius: 6px; margin-bottom: 1rem; font-size: 1rem; }
    form input:focus, form select:focus { outline: none; border-color: #2d6a4f; }
    .badge {
      display: inline-block; padding: .2rem .6rem; border-radius: 999px;
      font-size: .8rem; font-weight: 600;
    }
    .badge-green { background: #c6f6d5; color: #276749; }
    .badge-red   { background: #fed7d7; color: #9b2c2c; }
  </style>
</head>
<body>
  <header>
    <h1>💸 SplitFácil</h1>
    <nav>
      <a href="/users">Usuários</a>
      <a href="/expenses">Despesas</a>
      <a href="/summary">Resumo</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
