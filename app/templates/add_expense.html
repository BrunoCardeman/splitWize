{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:540px; margin:auto;">
  <h2>➕ Nova Despesa</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Descrição</label>
    <input type="text" name="description" placeholder="Ex: Jantar na pizzaria" required />

    <label>Valor (R$)</label>
    <input type="number" name="amount" step="0.01" min="0.01" placeholder="0.00" required />

    <label>Quem pagou?</label>
    <select name="paid_by" required>
      <option value="">-- selecione --</option>
      {% for user in users %}
      <option value="{{ user.id }}">{{ user.name }}</option>
      {% endfor %}
    </select>

    <label>Participantes (selecione um ou mais)</label>
    {% for user in users %}
    <label style="font-weight:normal; display:flex; gap:.5rem; margin-bottom:.4rem;">
      <input type="checkbox" name="participants" value="{{ user.id }}" />
      {{ user.name }}
    </label>
    {% endfor %}
    <br/>
    <button type="submit" class="btn btn-primary">Registrar</button>
    <a href="/expenses" class="btn btn-secondary" style="margin-left:.5rem;">Cancelar</a>
  </form>
</div>
{% endblock %}
